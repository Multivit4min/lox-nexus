# Lint, typecheck, the SDK's API check and tests on pull requests and pushes to main that touch
# what they check: code, dependencies, compiler and lint settings. Changes to the README, the
# changelog, docs/ or compose.yaml don't run them. Tests against real devices and services are
# skipped here: they only run when their variables (see .env.example) are set.
name: CI

on:
  push:
    branches: [main]
    # keep in sync with pull_request below
    paths:
      - "apps/**"
      - "packages/**"
      - "plugins/**"
      - package.json
      - package-lock.json
      - "tsconfig*.json"
      - eslint.config.js
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "plugins/**"
      - package.json
      - package-lock.json
      - "tsconfig*.json"
      - eslint.config.js
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # the SDK's public API must match its committed reports (ADR 0019)
      - run: npm run api:check
      - run: npm test
