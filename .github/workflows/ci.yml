# Lint, typecheck, the SDK's API check and tests on every pull request and push to main: the
# checks the project requires before a change is done. Tests against real devices and services
# are skipped here: they only run when their variables (see .env.example) are set.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # the SDK's public API must match its committed reports (ADR 0019)
      - run: npm run api:check
      - run: npm test
