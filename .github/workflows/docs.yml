# Builds the documentation site and publishes it on GitHub Pages
# (Settings → Pages → Source: GitHub Actions). The site has relative links, so it works under
# https://<owner>.github.io/<repo>/ as it does at /docs/ in Nexus itself.
name: Documentation

on:
  push:
    branches: [main]
    # the pages, and what they include: plugin READMEs and references, the SDK for its reference
    paths: ["apps/docs/**", "plugins/*/README.md", "plugins/*/REFERENCE.md", "packages/plugin-sdk/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

# one deployment at a time; a newer push waits rather than cancelling one half deployed
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # builds the SDK reference too, and fails on a broken link
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
