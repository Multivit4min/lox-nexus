# Builds the image for amd64 and arm64 and pushes it to the GitHub Container Registry. Only on
# demand: Actions → Docker image → Run workflow, choosing what to build under "Use workflow from":
#   branch main → ghcr.io/multivit4min/lox-nexus:edge and :sha-<short>
#   tag v1.2.3  → :1.2.3, :1.2 and :latest (push the tag first)
name: Docker image

on:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # arm64 runs emulated, but only the server's `npm ci` needs it: the UI, docs and plugin
      # bundles are built once on the runner's own platform (see the Dockerfile)
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=Lox Nexus
            org.opencontainers.image.description=Connects Home Assistant, Fronius, calendars and more to Loxone Miniservers over Network Intercommunication
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
