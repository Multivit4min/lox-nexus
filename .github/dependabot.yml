# Weekly update pull requests, grouped so a week brings one per ecosystem instead of dozens;
# CI checks each of them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint accepts TypeScript below 6.1 only; lift this once it supports 7
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # the types must describe the Node version the image runs (node:24), not a newer one
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # majors come one by one: they may need code changes
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # a new Node major is moved to on purpose, together with @types/node and the engines field
      - dependency-name: node
        update-types: ["version-update:semver-major"]
